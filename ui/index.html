<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Banka</title>
<link rel="icon" id="favicon" href="data:,">
<link rel="stylesheet" href="/style.css">
<script src="/app.js" defer></script>
</head>
<body>
<!-- Mini bank: the ready-made screen. Students do not edit this file. -->
<a class="skip" href="#main">İçeriğe geç</a>

<header class="topbar">
  <div class="wrap topbar-inner">
    <div class="brand">
      <span class="brand-mark" id="brand-mark" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><path d="M3.5 9.5L12 4.5l8.5 5zM5.5 12v5.5M10 12v5.5M14 12v5.5M18.5 12v5.5M3.5 20.5h17" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="brand-name" id="brand-name">Banka</span>
    </div>
    <div class="topbar-side">
      <span id="today"></span>
      <div class="who" id="who" hidden>
        <span class="who-text">
          <span class="who-name" id="who-name"></span>
          <span class="who-no" id="who-no"></span>
        </span>
        <button type="button" class="btn btn-on-brand" id="logout"><svg class="icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M9.5 20.5H6A1.5 1.5 0 0 1 4.5 19V5A1.5 1.5 0 0 1 6 3.5h3.5M15.5 16.5L20 12l-4.5-4.5M20 12H9.5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>Çıkış yap</button>
      </div>
    </div>
  </div>
</header>

<div class="banner" id="banner" role="alert" hidden>
  <div class="wrap banner-inner">
    <div class="banner-text" id="banner-text"></div>
    <button type="button" class="btn btn-small btn-secondary" id="banner-reload"><svg class="icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4.5V9H15" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>Sayfayı yenile</button>
  </div>
</div>

<main id="main" class="wrap" tabindex="-1">
  <p class="loading">Yükleniyor</p>
  <noscript>
    <p class="note note-warn">Bankanın ekranı için tarayıcınızda JavaScript açık olmalı.</p>
  </noscript>
</main>

<footer class="wrap footer">
  <button type="button" class="btn btn-small btn-secondary" id="reset"><svg class="icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M9 14.5L4.5 10 9 5.5M4.5 10H15a4.5 4.5 0 0 1 0 9h-3.5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>Verileri ilk haline döndür</button>
  <p>Bu uygulama yalnız sizin bilgisayarınızda çalışır; internete bir şey gönderilmez.</p>
</footer>
</body>
</html>
